# rtkpost options for multipath hemispherical map (MHM) construction
#
# Not a positioning config.  The rover coordinates are held fixed so that the
# double-differenced phase residuals carry the site multipath instead of having
# it absorbed by the position estimate.  Process with:
#
#   rnx2rtkp -k mhm.conf -y 3 -o out.pos rover.obs base.obs nav.nav
#
# then read the DD residuals from out.pos.stat ($SAT) together with the
# reference satellite of each epoch ($REFSAT).  The reference satellite itself
# carries resc=resp=0, so $REFSAT is what makes the DD equations reconstructable.
#
# The base station must be in an open-sky environment.  Multipath at the base
# adds to the rover's and the two cannot be separated afterwards.

pos1-posmode       =fixed      # known rover coords: do not let the position soak up multipath
pos1-frequency     =l1+l2
pos1-soltype       =forward
pos1-elmask        =10         # low, to cover the whole hemisphere; QC happens downstream
pos1-snrmask_r     =off        # contaminated data is still data: do not throw it away here
pos1-snrmask_b     =off
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =off        # short baseline: cancels in the DD, keep model error out
pos1-tropopt       =off        # same
pos1-sateph        =brdc
pos1-navsys        =17         # 1:gps + 16:qzs, deliberately without sbas (see pos1-qzsmerge)

# reference satellite (pivot) selection
#   0:elevation    RTKLIB default, highest elevation
#   1:snr          highest rover C/N0
#   2:elevation2nd 2nd highest elevation      (invariance diagnostic)
#   3:random       random above refsatelmin   (invariance diagnostic)
#   4:mask         highest outside the az-el obstruction mask in rtkpos.c
#   5:pinned       pinned satellite below, else highest QZSS
pos1-refsatmode    =0
pos1-refsatelmin   =30         # (deg) candidate threshold for modes 3 and 5
pos1-refsatprn     =           # e.g. J07, a QZSS GEO: makes the pivot multipath a constant
                               # that the map inversion absorbs into its datum
pos1-qzsmerge      =off        # on: QZSS joins the GPS DD group so it can serve as pivot.
                               # Verify first on a zero baseline that inter-system bias does
                               # not break integer ambiguities (identical receiver model and
                               # firmware at both ends is what makes it cancel in the DD).
                               # Note SBAS shares the GPS group, hence no sbas in pos1-navsys.

pos2-armode        =fix-and-hold  # only fixed epochs are used downstream
pos2-gloarmode     =off
pos2-arthres       =3
pos2-arlockcnt     =0
pos2-arelmask      =10         # (deg)
pos2-aroutcnt      =5
pos2-arminfix      =10
pos2-slipthres     =0.05       # (m)
pos2-maxage        =30         # (s)
pos2-rejionno      =30         # (m)
pos2-niter         =1

# Observation error model.  varerr() already inflates the variance when C/N0
# falls below stats-snrmax, which matters here: a satellite blocked by a local
# obstruction still looks "high elevation" and would otherwise be trusted far
# too much, biasing the whole weight matrix.  Calibrate stats-snrmax from the
# site's own (elevation, C/N0) data, fitted over the clean azimuths only --
# including the obstructed sector teaches the model that the obstruction is normal.
stats-errphase     =0.003      # (m)
stats-errphaseel   =0.003      # (m)
stats-errphasebl   =0          # (m/10km)
stats-snrmax       =52         # (dB.Hz)
stats-errsnr       =0.003      # (m) 0 disables the C/N0 term

out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outstat        =residual   # required: writes $SAT and $REFSAT to <out>.stat

# Known rover coordinates.  Fill these in; pos1-posmode=fixed uses them directly.
ant1-postype       =llh        # (0:llh,1:xyz,2:single,3:posfile,4:rinexhead,5:rtcm)
ant1-pos1          =0          # (deg|m)
ant1-pos2          =0          # (deg|m)
ant1-pos3          =0          # (m|m)
ant2-postype       =rinexhead
